DATASET:
  # Không split/subset gì cả — dùng thẳng toàn bộ images/train + images/val
  # đã có sẵn trên dataset mirror (ROOT_DIR được resolve động lúc chạy, xem
  # resolve_dataset_paths() trong src/train_unet_former_resnet18.py — path
  # dưới đây chỉ là gợi ý ban đầu, không bắt buộc khớp tuyệt đối cấu trúc
  # mount thật trên Kaggle).
  ROOT_DIR: "/kaggle/input/datasets/aletbm/global-land-cover-mapping-openearthmap"
  TRAIN_IMG_DIR: "images/train"
  TRAIN_MASK_DIR: "labels/train"
  VAL_ROOT_DIR: "/kaggle/input/datasets/aletbm/global-land-cover-mapping-openearthmap"
  VAL_IMG_DIR: "images/val"
  VAL_MASK_DIR: "labels/val"
  # KHÔNG khai báo TRAIN_SPLIT_FILE/VAL_SPLIT_FILE ở đây — để trống nghĩa là
  # OpenEarthMapDataset đọc trực tiếp TOÀN BỘ ảnh có trong TRAIN_IMG_DIR/
  # VAL_IMG_DIR, không qua bất kỳ file split/subset nào.

MODEL:
  ARCH: "UnetFormer"
  ENCODER: "resnet18.fb_swsl_ig1b_ft_in1k"
  PRETRAINED: true
  DECODE_CHANNELS: 64
  WINDOW_SIZE: 8
  NUM_HEADS: 8
  MLP_RATIO: 4.0
  DROP_PATH_RATE: 0.1
  DROPOUT_RATIO: 0.1

LOSS:
  TYPE: "CombinedLoss"
  CE_WEIGHT: 1.0
  DICE_WEIGHT: 1.0

TRAIN:
  SEED: 19
  NUM_CLASSES: 9
  MAX_ITERS: 40000
  VAL_INTERVAL: 4000
  EARLY_STOPPING_PATIENCE: 4
  BATCH_SIZE_PER_GPU: 4
  NUM_WORKERS: 2
  WARMUP_ITERS: 500

OPTIMIZER:
  BASE_LR: 0.0006
  WEIGHT_DECAY: 0.01
  GRAD_CLIP: 5.0

OUTPUT:
  WORK_DIR: "/kaggle/working/unetformer-resnet18-combinedloss-openearthmap/work_dirs/baseline"
